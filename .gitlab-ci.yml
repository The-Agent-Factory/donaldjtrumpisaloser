# GitLab is the source of truth (GitHub account suspended 2026-07, treated as
# gone). Railway cannot natively connect to GitLab, so deployment runs here:
# on every push to main, this pipeline uses the Railway CLI to deploy the repo.
#
# Required GitLab CI/CD variables (Settings -> CI/CD -> Variables):
#   RAILWAY_TOKEN       Railway account/project token (already set, masked)
#   RAILWAY_PROJECT_ID  the Railway project id (already set)
stages:
  - deploy

deploy_railway:
  stage: deploy
  image: node:20
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: on_success
  script:
    - npm install -g @railway/cli
    - railway up --service donaldjtrumpisaloser --ci
