# GitLab is the source of truth (GitHub account suspended 2026-07, treated as
# gone). Two concerns run here:
#
#   1. deploy_railway — deploys the Next.js site in site/ to Railway
#      (Railway cannot natively connect to GitLab).
#   2. update — the Accountability Wire automation: aggregates feeds, runs the
#      daily multi-LLM panel, generates social/Substack/Shorts content, and
#      exports JSON into site/public/data/ so the live site serves it.
#
# Pipeline schedules to create (CI/CD -> Schedules):
#   - every 2 hours ("0 */2 * * *")  -> variable PIPELINE_MODE=wire
#   - daily 11:00 UTC ("0 11 * * *") -> variable PIPELINE_MODE=panel
#
# CI/CD variables (Settings -> CI/CD -> Variables, masked where possible):
#   RAILWAY_TOKEN / RAILWAY_PROJECT_ID   (already set)
#   ANTHROPIC_API_KEY / OPENAI_API_KEY / GEMINI_API_KEY / XAI_API_KEY  panel seats
#   NEWSAPI_KEY                          extra firehose (optional)
#   GITLAB_PUSH_TOKEN                    Project Access Token (Developer,
#                                        write_repository) so runs commit data back
#   SITE_URL                             https://donaldjtrumpisaloser.com
#   AUTOPOST_X + X_API_KEY/X_API_SECRET/X_ACCESS_TOKEN/X_ACCESS_SECRET
#   AUTOPOST_YOUTUBE + YT_CLIENT_ID/YT_CLIENT_SECRET/YT_REFRESH_TOKEN (+YT_PRIVACY)

stages:
  - update
  - deploy

update:
  stage: update
  image: python:3.12-slim
  # CI GATED 2026-08-12: the schedules burned the free tier's 400 min/month.
  # The pipeline now runs on Railway cron services (railway-cron/). This job
  # stays as a manual web-trigger fallback ONLY — never re-add schedule/push
  # rules (schedules are also deactivated in CI/CD -> Schedules).
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: manual
  cache:
    key: wire-data
    paths: [data/]
  script:
    - apt-get update -qq && apt-get install -y -qq git > /dev/null
    - python3 scripts/aggregate.py
    - |
      if [ "$PIPELINE_MODE" = "panel" ] || [ "$CI_PIPELINE_SOURCE" = "web" ]; then
        python3 scripts/llm_panel.py
        python3 scripts/social_posts.py
        apt-get install -y -qq ffmpeg fonts-dejavu-core > /dev/null
        python3 scripts/shorts_video.py
      fi
    - python3 scripts/export_to_site.py
    - |
      if [ -n "$GITLAB_PUSH_TOKEN" ] && [ "$CI_PIPELINE_SOURCE" != "push" ]; then
        git config user.name "accountability-wire-bot"
        git config user.email "bot@users.noreply.gitlab.com"
        git add -A data site/public/data ':!*.mp4'
        git add -f site/public/shorts/latest.mp4 2>/dev/null || true
        if ! git diff --cached --quiet; then
          git commit -m "Automated update: wire + panel data ($(date -u +%Y-%m-%dT%H:%MZ))"
          PUSH_URL="https://wire-bot:${GITLAB_PUSH_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
          TARGET="${CI_COMMIT_BRANCH:-$CI_DEFAULT_BRANCH}"
          git fetch "$PUSH_URL" "$TARGET"
          git rebase FETCH_HEAD || { git rebase --abort; echo "rebase conflict - skipping commit-back"; }
          git push "$PUSH_URL" "HEAD:$TARGET" -o ci.skip || echo "commit-back push failed (non-fatal)"
        fi
      fi
  artifacts:
    paths: [data/posts/, site/public/data/, site/public/shorts/]
    expire_in: 2 days

# Deploys site/ to Railway. Runs on pushes to main and after scheduled data
# updates (the update job's artifacts overlay fresh JSON onto the checkout,
# so the deployed build includes the newest wire/panel data).
deploy_railway:
  stage: deploy
  image: node:20
  # CI GATED 2026-08-12 (see update job). Site deploys happen from the Railway
  # cron runs (railway up inside railway-cron/run.sh) or locally.
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: manual
  script:
    - npm install -g @railway/cli
    - railway up --service donaldjtrumpisaloser --ci
